name: Octagonal honeycomb — Lean checks

on:
  workflow_dispatch:
    inputs:
      graph:
        description: Lean graph to build
        required: true
        default: standalone
        type: choice
        options:
          - standalone
          - canonical
          - both

permissions:
  contents: read

concurrency:
  group: octagonal-honeycomb-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build standalone graph
        if: inputs.graph == 'standalone' || inputs.graph == 'both'
        shell: bash
        working-directory: projects/octagonal-honeycomb/lean/standalone
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake build --wfail 2>&1 | tee standalone-build.log
          ! grep -R --line-number -E '\bsorry\b|\badmit\b|sorryAx|^[[:space:]]*axiom[[:space:]]' \
            --include='*.lean' .

      - name: Build canonical snapshot
        if: inputs.graph == 'canonical' || inputs.graph == 'both'
        shell: bash
        working-directory: projects/octagonal-honeycomb/lean/canonical
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake build Project --wfail 2>&1 | tee canonical-build.log
          ! grep -R --line-number -E '\bsorry\b|\badmit\b|sorryAx|^[[:space:]]*axiom[[:space:]]' \
            --include='*.lean' .

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: octagonal-honeycomb-lean-logs
          path: |
            projects/octagonal-honeycomb/lean/standalone/*-build.log
            projects/octagonal-honeycomb/lean/canonical/*-build.log
          if-no-files-found: ignore
