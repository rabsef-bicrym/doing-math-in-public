name: One-time rabsef-talwet source migration

on:
  push:
    branches: [migration/rabsef-talwet-canonical]
    paths: [.github/workflows/migrate-rabsef-talwet-source.yml]
  pull_request:
    branches: [master]
    paths: [.github/workflows/migrate-rabsef-talwet-source.yml]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: migration/rabsef-talwet-canonical
      - name: Download exported private source snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-c00c-81fb-8c0d-548f59faf0c9/raw?se=2026-08-01T19:29:25Z&sp=r&sv=2026-02-06&sr=b&scid=9b91f4fc-9a06-5c95-8926-8276c63c3e70&skoid=18c14e53-ea0c-429b-8d09-d22d66ca7169&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T12:25:43Z&ske=2026-08-02T12:25:43Z&sks=b&skv=2026-02-06&sig=SvASeUFqp8hs3CXzgt2LL%2B1yeCryoZS%2B0xLS9XSsZhs%3D' -o /tmp/source-export.zip
          mkdir -p /tmp/source-export
          unzip -q /tmp/source-export.zip -d /tmp/source-export
          tar -xzf /tmp/source-export/rabsef-talwet-octagon-source.tar.gz -C /tmp/source-export
      - name: Install source snapshot in project layout
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/source-export/rabsef-talwet-octagon
          CANON=projects/octagonal-honeycomb/lean/canonical
          mkdir -p "$CANON"
          cp "$SRC"/*.lean "$CANON/"
          cp "$SRC/lakefile.toml" "$SRC/lean-toolchain" "$SRC/lake-manifest.json" "$CANON/"

          mkdir -p projects/octagonal-honeycomb/archive/ci-snapshots/rabsef-talwet
          cp "$SRC/.github/workflows/"*.yml projects/octagonal-honeycomb/archive/ci-snapshots/rabsef-talwet/

          mkdir -p projects/octagonal-honeycomb/archive/source-snapshots/rabsef-talwet/interval
          cp "$SRC/interval/"* projects/octagonal-honeycomb/archive/source-snapshots/rabsef-talwet/interval/

          mkdir -p projects/octagonal-honeycomb/evidence/rabsef-talwet
          cp "$SRC/FINITE_CLOSURE_STATUS.md" "$SRC/FORMALIZATION_LOCAL_GREEN.marker" projects/octagonal-honeycomb/evidence/rabsef-talwet/

          mkdir -p projects/octagonal-honeycomb/provenance/rabsef-talwet
          cp /tmp/source-export/PROVENANCE.txt /tmp/source-export/SHA256SUMS projects/octagonal-honeycomb/provenance/rabsef-talwet/

          cat > "$CANON/README.md" <<'EOF'
          # Canonical Lean source snapshot

          This directory preserves the integrated `rabsef-talwet` formalization from branch
          `octagon-envelope-2026-07-24`, exported on 2026-08-01. It is kept as an exact
          source snapshot, including modules that are incomplete, superseded, or not part
          of a single currently-green dependency graph.

          Run Lean from this directory. The pinned toolchain is Lean 4.30.0 with Mathlib
          4.30.0. Consult the project-level `STATUS.md` before treating any module as an
          end-to-end theorem.
          EOF
          sed -i 's/^          //' "$CANON/README.md"

          cat > projects/octagonal-honeycomb/archive/ci-snapshots/rabsef-talwet/README.md <<'EOF'
          # Archived CI workflows

          These workflows are retained as provenance from `rabsef-talwet`. They are stored
          outside `.github/workflows` intentionally: they are historical evidence and must
          not automatically run in this repository.
          EOF
          sed -i 's/^          //' projects/octagonal-honeycomb/archive/ci-snapshots/rabsef-talwet/README.md

          cat > projects/octagonal-honeycomb/archive/source-snapshots/rabsef-talwet/README.md <<'EOF'
          # Archived source variants

          This directory retains noncanonical source variants from the private
          `rabsef-talwet` export. The active interval implementation lives in the project
          `interval/` directory; this copy exists for comparison and audit.
          EOF
          sed -i 's/^          //' projects/octagonal-honeycomb/archive/source-snapshots/rabsef-talwet/README.md

          cat > projects/octagonal-honeycomb/provenance/rabsef-talwet/README.md <<'EOF'
          # rabsef-talwet provenance

          The source was exported from private repository `rabsef-bicrym/rabsef-talwet`
          using a one-shot GitHub Actions archive. `SHA256SUMS` records the original export
          paths and hashes. Files were reorganized into the public project layout without
          silently upgrading their proof status.
          EOF
          sed -i 's/^          //' projects/octagonal-honeycomb/provenance/rabsef-talwet/README.md
      - name: Commit migrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/octagonal-honeycomb
          git commit -m 'Complete canonical rabsef-talwet source migration' || exit 0
          git push origin HEAD:migration/rabsef-talwet-canonical
