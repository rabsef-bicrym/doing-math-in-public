name: Lean interval root-box bridge verification

on:
  push:
    branches: [octagon-classification-ci-2026-07-29]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: root-box-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lean dependency cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.elan/toolchains
            .lake/packages
          key: public-octagon-lean-v430-mathlib430
      - name: Resolve mathlib when absent
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .lake/packages/mathlib ]; then lake update; fi
          if [ ! -d .lake/packages/mathlib/.lake/build/lib/lean/Mathlib ]; then lake exe cache get; fi
      - name: Generate exact middle-defect certificate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_pentagon_middle_defect.py
      - name: Build registered prerequisites
        shell: bash
        run: |
          set -o pipefail
          lake build OctagonCI --wfail 2>&1 | tee root-box.log
      - name: Kernel-check the complete root-box bridge
        shell: bash
        run: |
          set -o pipefail
          for f in ArctanSeventhLower DangerousTurnBoundsStandalone \
                   DangerousFanClassificationStandalone NegativeOwnerBudgetStandalone \
                   CyclicRootEdgeSelectionStandalone; do
            lake env lean "$f.lean" 2>&1 | tee -a root-box.log
          done
      - name: Reject proof holes
        shell: bash
        run: |
          ! grep -nE '\bsorry\b|sorryAx|^[[:space:]]*axiom[[:space:]]' \
            PentagonMiddleDefectGenerated.lean ArctanSeventhLower.lean \
            DangerousTurnBoundsStandalone.lean DangerousFanClassificationStandalone.lean \
            NegativeOwnerBudgetStandalone.lean CyclicRootEdgeSelectionStandalone.lean
      - name: Upload proof and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: interval-root-box-bridge-proof
          path: |
            PentagonMiddleDefectGenerated.lean
            root-box.log
          if-no-files-found: ignore
