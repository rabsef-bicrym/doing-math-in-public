name: Lean generated pentagon classification verification

on:
  push:
    branches: [octagon-classification-ci-2026-07-29]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: generated-pentagon-classification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lean dependency cache
        id: lean-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.elan/toolchains
            .lake/packages
          key: public-octagon-lean-v430-mathlib430

      - name: Resolve mathlib when absent
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .lake/packages/mathlib ]; then lake update; fi
          if [ ! -d .lake/packages/mathlib/.lake/build/lib/lean/Mathlib ]; then lake exe cache get; fi

      - name: Generate exact Bernstein certificate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_pentagon_middle_defect.py
          test -s PentagonMiddleDefectGenerated.lean

      - name: Kernel-check classification stack
        shell: bash
        run: |
          set -o pipefail
          lake build OctagonCI --wfail 2>&1 | tee classification-generated.log

      - name: Reject proof holes
        shell: bash
        run: |
          ! grep -nE '\bsorry\b|sorryAx|^[[:space:]]*axiom[[:space:]]' \
            OctagonBenchmarkStandalone.lean FirstSectorClassificationAlgebra.lean \
            PentagonMiddleDefectGenerated.lean

      - name: Upload exact generated source and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: generated-pentagon-classification
          path: |
            PentagonMiddleDefectGenerated.lean
            classification-generated.log
          if-no-files-found: ignore
