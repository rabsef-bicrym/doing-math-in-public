name: Noncrystalline interval certificate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: noncrystalline-interval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    name: Rebuild interval certificate and kernel-check Lean import
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native interval dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libboost-dev libmpfr-dev

      - name: Build and run directed-rounding Boost verifier
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -std=c++20 -frounding-math interval/interval_verifier_emit.cpp -o interval/interval_verifier_emit
          /usr/bin/time -v interval/interval_verifier_emit interval/fast_certificate.octv1 \
            2>&1 | tee interval/fast_certificate.log
          grep -q '^CERTIFIED_AND_EMITTED$' interval/fast_certificate.log

      - name: Build and run independent 192-bit MPFR replay
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -std=c++20 interval/mpfr_recheck_fullx.cpp -lmpfr -lgmp -o interval/mpfr_recheck_fullx
          /usr/bin/time -v interval/mpfr_recheck_fullx \
            interval/fast_certificate.octv1 interval/mpfr_certificate.octv2 \
            2>&1 | tee interval/mpfr_certificate.log
          if grep -Eq 'refined=[1-9][0-9]*' interval/mpfr_certificate.log; then
            echo 'MPFR replay required unexpected tree refinement.' >&2
            exit 1
          fi

      - name: Generate Lean import and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 interval/build_lean_certificate.py \
            --input interval/mpfr_certificate.octv2 \
            --output NoncrystallineIntervalCertificate.lean \
            --manifest interval/noncrystalline_interval_manifest.json \
            --summary interval/NONCRYSTALLINE_INTERVAL_CERTIFICATE.md \
            2>&1 | tee interval/generator.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('interval/noncrystalline_interval_manifest.json').read_text())
          assert m['format']=='OCTV2'
          assert len(m['cases'])==12
          assert m['allLeafNumeratorsPositive'] is True
          assert {(c['owner'],c['neighbor']) for c in m['cases']} == {(a,b) for a in (4,5) for b in range(4,10)}
          print('manifest checks passed:', m['combinedSha256'])
          PY
          sha256sum interval/fast_certificate.octv1 interval/mpfr_certificate.octv2 NoncrystallineIntervalCertificate.lean \
            | tee interval/certificate.sha256

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -o pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none 2>&1 | tee interval/elan-install.log
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lean dependency cache
        id: lean-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.elan/toolchains
            .lake/packages
          key: lean-envelope-v430-mathlib430
          restore-keys: |
            lean-envelope-v430-

      - name: Resolve pinned dependencies when absent
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .lake/packages/mathlib ]; then
            "$HOME/.elan/bin/lake" update 2>&1 | tee interval/lake-update.log
          else
            echo 'Restored Mathlib package tree.' | tee interval/lake-update.log
          fi
          if [ ! -d .lake/packages/mathlib/.lake/build/lib/lean/Mathlib ]; then
            "$HOME/.elan/bin/lake" exe cache get 2>&1 | tee interval/mathlib-cache.log
          else
            echo 'Restored precompiled Mathlib oleans.' | tee interval/mathlib-cache.log
          fi

      - name: Kernel-compile generated Lean certificate import
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          /usr/bin/time -v "$HOME/.elan/bin/lake" env lean \
            -o .lake/build/lib/lean/NoncrystallineIntervalCertificate.olean \
            NoncrystallineIntervalCertificate.lean \
            2>&1 | tee interval/lean-certificate-build.log
          ! grep -nE '\bsorry\b|sorryAx|^[[:space:]]*axiom[[:space:]]' NoncrystallineIntervalCertificate.lean

      - name: Upload reproducible certificate bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: noncrystalline-interval-certificate
          path: |
            interval/fast_certificate.log
            interval/mpfr_certificate.log
            interval/generator.log
            interval/lean-certificate-build.log
            interval/certificate.sha256
            interval/fast_certificate.octv1
            interval/mpfr_certificate.octv2
            interval/noncrystalline_interval_manifest.json
            interval/NONCRYSTALLINE_INTERVAL_CERTIFICATE.md
            NoncrystallineIntervalCertificate.lean
          if-no-files-found: ignore
