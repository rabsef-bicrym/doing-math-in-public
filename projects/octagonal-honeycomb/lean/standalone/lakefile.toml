name = "OctagonCI"
defaultTargets = ["OctagonCI"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

[[lean_lib]]
name = "OctagonCI"
roots = [
  "OctagonBase",
  "ArctanPolynomialBounds",
  "FirstSectorAlgebra",
  "FirstSectorScalar",
  "FirstSectorMonotonicityStandalone",
  "FirstSectorDefectStandalone",
  "SecondSectorDefectStandalone",
  "ThirdSectorDefectStandalone",
  "SmallGapBernsteinStandalone",
  "SmallGapReserveStandalone",
  "SmallSectorMonotonicityStandalone",
  "AllSectorDefectStandalone",
  "PhaseSectorAlgebraStandalone",
  "OctagonSupportNormalizationStandalone",
  "PhaseGapBridgeStandalone",
  "ReducedFanBridgeStandalone",
  "OctagonBenchmarkStandalone",
  "FirstSectorClassificationAlgebra",
  "DangerousFanClassificationStandalone",
  "DangerousOwnerRootStandalone",
  "NeighborRangeReductionStandalone",
  "SelectedEdgePartitionStandalone",
  "RoleCapacityStandalone",
  "NegativeChargeSelectionStandalone",
  "SelectedChargeLedgerStandalone",
  "CollisionDebtGroupingStandalone",
  "CapacityBankStandalone",
  "SelectedResourceClosureStandalone"
]
